trigger:
  - dev

variables:
  - name: imageName
    value: auspira/frontend
  - name: tag
    value: $(Build.BuildId)
  - name: acrName
    value: auspiradevacr
  # Public build-time vars — safe to store here
  - name: NEXT_PUBLIC_BACKEND_URL
    value: 'https://auspira-dev-contaiber-be.jollypond-463e3e8f.uksouth.azurecontainerapps.io'
  - name: NEXT_PUBLIC_ENVIRONMENT
    value: 'production'
  - name: NEXTAUTH_URL
    value: 'https://auspira-dev-container-fe.jollypond-463e3e8f.uksouth.azurecontainerapps.io'
  # NEXTAUTH_SECRET — add as a secret pipeline variable in Azure DevOps UI (Pipelines → Edit → Variables)

pool:
  vmImage: ubuntu-latest

stages:
  # ---------------- QUALITY GATES ----------------
  - stage: Quality
    displayName: Typecheck and Unit Tests
    jobs:
      - job: QualityChecks
        variables:
          LEFTHOOK: '0' # no .git-hook setup needed in CI (matches Dockerfile)
        steps:
          - task: NodeTool@0
            displayName: Use Node 22
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            displayName: Install dependencies
          - script: npm run check-types
            displayName: Typecheck (tsc)
          - script: npm run test
            displayName: Unit tests (vitest)

  # ---------------- BUILD & PUSH IMAGE ----------------
  - stage: Build
    displayName: Build and Push Image
    dependsOn: Quality
    jobs:
      - job: BuildPush
        steps:
          - task: Docker@2
            displayName: Build and Push to ACR
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: 'Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              containerRegistry: auspira-acr-connection
              tags: |
                $(tag)
              arguments: >
                --build-arg NEXT_PUBLIC_BACKEND_URL=$(NEXT_PUBLIC_BACKEND_URL)
                --build-arg NEXT_PUBLIC_ENVIRONMENT=$(NEXT_PUBLIC_ENVIRONMENT)
  # ---------------- DEPLOY TO AZURE CONTAINER APPS ----------------
  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    jobs:
      - job: DeployContainerApp
        steps:
          - task: AzureCLI@2
            displayName: Update Container App
            inputs:
              azureSubscription: auspira-azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Ensure ingress is external (publicly accessible)
                az containerapp ingress enable \
                  --name auspira-dev-container-fe \
                  --resource-group Auspira-Dev \
                  --type external \
                  --target-port 3000 \
                  --transport auto

                az containerapp update \
                  --name auspira-dev-container-fe \
                  --resource-group Auspira-Dev \
                  --image auspiradevacr.azurecr.io/auspira/frontend:$(Build.BuildId) \
                  --set-env-vars \
                    NODE_ENV=production \
                    PORT=3000 \
                    HOSTNAME=0.0.0.0 \
                    NEXTAUTH_URL=$(NEXTAUTH_URL) \
                    NEXTAUTH_SECRET=$(NEXTAUTH_SECRET) \
                    NEXT_PUBLIC_BACKEND_URL=$(NEXT_PUBLIC_BACKEND_URL) \
                    NEXT_PUBLIC_ENVIRONMENT=$(NEXT_PUBLIC_ENVIRONMENT)
